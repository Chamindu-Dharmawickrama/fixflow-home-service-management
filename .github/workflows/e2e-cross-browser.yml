name: E2E cross-browser

# The full Playwright run on Chromium, Firefox and WebKit (T25): Firefox and WebKit run the main
# journey and the design-system and keyboard specs, Chromium runs everything. Too slow for every
# push, so it runs nightly and on demand; ci.yml runs Chromium on every push and pull request.
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-cross-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      E2E_DATABASE_URL: postgresql://fixflow_test:fixflow_test@localhost:5432/fixflow_e2e
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: fixflow_e2e
          POSTGRES_USER: fixflow_test
          POSTGRES_PASSWORD: fixflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixflow_test -d fixflow_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
        working-directory: e2e

      - name: Build the shared package and the Prisma client
        run: npm run build:shared && npm run db:generate

      - name: End-to-end tests (all projects)
        run: npx playwright test
        working-directory: e2e

      - name: Upload the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-cross-browser
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14
