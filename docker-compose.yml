# Local PostgreSQL for the API integration tests (and, optionally, development).
#
#   npm run db:test:up      start it (waits until it accepts connections)
#   npm run db:test:down    stop it (the data survives in the named volume)
#
# The credentials below are throwaway values for a database that only listens on localhost and
# holds only test data. Never reuse them anywhere else. The port is 5433 so it does not collide
# with a PostgreSQL already installed on 5432.
name: fixflow

services:
  postgres:
    image: postgres:18-alpine
    container_name: fixflow-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_DB: fixflow_test
      POSTGRES_USER: fixflow_test
      POSTGRES_PASSWORD: fixflow_test
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      # PostgreSQL 18+ images keep the cluster in a versioned directory below this path.
      - fixflow_test_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixflow_test -d fixflow_test"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  fixflow_test_data:
